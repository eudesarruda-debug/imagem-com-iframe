<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Integração Pipefy</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }

    iframe {
      display: block;
      width: 100%;
      min-height: 900px;
      border: 0;
    }
  </style>
</head>
<body>
  <iframe
    id="webhook"
    title="Integração Pipefy"
  ></iframe>

  <script>
    const cardPaiId = new URLSearchParams(window.location.search).get('cardPaiId');
    const webhook = document.getElementById('webhook');

    if (cardPaiId) {
      webhook.src = `https://ipaas.pipefy.com/api/v1/webhooks/0ePOoShcHy1iiOB07IGj5/sync?cardPaiId=${encodeURIComponent(cardPaiId)}`;
    }
  </script>
</body>
</html>
