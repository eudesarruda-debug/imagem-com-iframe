<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teste - Formulário Inicial + Cadastro de Consultores</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f6f8;
      color: #182026;
    }
    .container {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }
    .bloco {
      background: #ffffff;
      border: 1px solid #d8dee8;
      border-radius: 10px;
      margin-bottom: 24px;
      overflow: hidden;
    }
    .titulo {
      padding: 14px 16px;
      font-size: 16px;
      font-weight: 700;
      border-bottom: 1px solid #e6e9ef;
    }
    iframe {
      display: block;
      width: 100%;
      border: 0;
      background: #ffffff;
    }
    .pipefy-frame { min-height: 580px; }
    .consultores-frame { min-height: 900px; }
  </style>
</head>
<body>
  <div class="container">

    <div class="bloco">
      <div class="titulo">Formulário Inicial - Pipefy</div>
      <iframe
        class="pipefy-frame"
        src="https://app.pipefy.com/public/form/b2PxmqM5?embedded=true"
        width="100%"
        height="580"
        frameborder="0">
      </iframe>
    </div>

    <div class="bloco">
      <div class="titulo">Cadastro de Consultores</div>
      <iframe
        class="consultores-frame"
        src="https://ipaas.pipefy.com/api/v1/webhooks/0ePOoShcHy1iiOB07IGj5/sync?cardPaiId=1442456755"
        width="100%"
        height="900"
        frameborder="0"
        style="width:100%;min-height:900px;border:0;">
      </iframe>
    </div>

  </div>
</body>
</html>
